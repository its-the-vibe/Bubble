redis:
  addr: "localhost:6379"
  password: ""  # Can be overridden by REDIS_PASSWORD environment variable
  list_name: "poppit:notifications"  # Global default

server:
  port: "8080"

commands:
  - name: "Deploy Production"
    repo: "example/repo"
    branch: "refs/heads/main"
    type: "manual-trigger"
    dir: "/opt/deployments/production"
    list_name: "poppit:prod-queue"  # Optional override: publishes to a different Redis list
    commands:
      - "git pull origin main"
      - "./deploy.sh production"

  - name: "Run Tests"
    repo: "example/repo"
    branch: "refs/heads/develop"
    type: "manual-trigger"
    dir: "/opt/testing"
    # No list_name specified - falls back to global "poppit:notifications"
    commands:
      - "npm install"
      - "npm test"

  - name: "Build Docker Image"
    repo: "example/repo"
    branch: "refs/heads/main"
    type: "manual-trigger"
    dir: "/opt/docker-builds"
    commands:
      - "docker build -t myapp:latest ."
      - "docker push myapp:latest"

  - name: "Restart Service"
    repo: "example/service"
    branch: "refs/heads/main"
    type: "manual-trigger"
    dir: "/opt/services"
    commands:
      - "systemctl restart myservice"
      - "systemctl status myservice"
